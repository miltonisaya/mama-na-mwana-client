<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">menu</mat-icon>
    <div>
      <h2 mat-dialog-title>{{MenuService.form.controls['id'].value ? "Edit Menu" : "Create Menu"}}</h2>
      <p class="mnm-dialog-subtitle">Configure navigation menu item details</p>
    </div>
  </div>

  <form #formDirective="ngForm" [formGroup]="MenuService.form" (ngSubmit)="submitForm(MenuService.form.value)">
    <mat-dialog-content class="mnm-dialog-body">
      <div class="mnm-row">
        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>Name</mat-label>
          <mat-icon matPrefix>label</mat-icon>
          <input matInput autocomplete="off" formControlName="name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>Icon</mat-label>
          <mat-icon matPrefix>insert_emoticon</mat-icon>
          <input matInput autocomplete="off" formControlName="icon" required>
        </mat-form-field>
      </div>

      <div class="mnm-row">
        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>Sort Order</mat-label>
          <mat-icon matPrefix>sort</mat-icon>
          <input matInput autocomplete="off" formControlName="sortOrder" required type="number">
        </mat-form-field>

        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>URL</mat-label>
          <mat-icon matPrefix>link</mat-icon>
          <input matInput autocomplete="off" formControlName="url">
        </mat-form-field>
      </div>

      <div class="mnm-row">
        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>Parent Menu</mat-label>
          <mat-icon matPrefix>account_tree</mat-icon>
          <select matNativeControl formControlName="parentId">
            <option value="">— None —</option>
            <option *ngFor="let menu of parentMenus" [value]="menu.id">{{menu.name}}</option>
          </select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="mnm-field">
          <mat-label>Role</mat-label>
          <mat-icon matPrefix>admin_panel_settings</mat-icon>
          <select matNativeControl formControlName="roleId" required>
            <option value="">— Select Role —</option>
            <option *ngFor="let role of roles" [value]="role.id">{{role.name}}</option>
          </select>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions class="mnm-dialog-foot">
      <button mat-button mat-dialog-close type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit">
        {{MenuService.form.controls['id'].value ? "Update" : "Create"}}
      </button>
    </mat-dialog-actions>
  </form>
</div>
