<div class="dialog-header">
  <div class="header-icon">
    <mat-icon>edit</mat-icon>
  </div>
  <h2 mat-dialog-title>Edit Contact</h2>
  <p class="dialog-subtitle">Update the facility code for this contact</p>
</div>

<mat-divider></mat-divider>

<form #formDirective="ngForm"
      (ngSubmit)="submitForm(contactService.form)"
      [formGroup]="contactService.form">

  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Facility Code</mat-label>
      <mat-icon matPrefix>local_hospital</mat-icon>
      <input autocomplete="off"
             formControlName="facilityCode"
             matInput
             maxlength="8"
             placeholder="Enter facility code"
             required>
      <mat-hint>Maximum 8 characters</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close type="button" class="cancel-btn">
      Cancel
    </button>
    <button color="primary" mat-raised-button type="submit" class="save-btn">
      <mat-icon>save</mat-icon>
      {{contactService.form.controls['id'].value ? "Update" : "Save"}}
    </button>
  </mat-dialog-actions>

</form>
