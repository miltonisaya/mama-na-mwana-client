<div class="page-header">
  <div>
    <h2 class="page-title">
      <mat-icon>dataset</mat-icon>
      Manage Datasets
    </h2>
    <p class="page-subtitle">View and manage DHIS2 datasets and their data elements</p>
  </div>
  <button *ngIf="userCan('DATA_SET_SYNC_DATA_SETS')" (click)="syncDatasets()" mat-raised-button color="primary" class="sync-btn">
    <mat-icon>sync</mat-icon>
    Sync Datasets
  </button>
</div>

<mat-card class="table-card">
  <mat-card-content>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Select a dataset</mat-label>
      <select matNativeControl (change)="onDatasetSelected($event)">
        <option value="">— choose a dataset —</option>
        <option *ngFor="let dataset of datasets" [value]="dataset.id">
          {{ dataset.displayName }}
        </option>
      </select>
    </mat-form-field>

    <p *ngIf="!selectedDataSetId" style="color: #6b7280; padding: 8px 0;">
      Select a dataset above to view its data elements.
    </p>

    <p *ngIf="selectedDataSetId" style="color: #1976d2; padding: 8px 0;">
      Dataset selected: {{ selectedDataSetId }}
    </p>

  </mat-card-content>
</mat-card>
