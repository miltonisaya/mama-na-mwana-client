<div class="login-dialog">
  <div class="dialog-header">
    <div class="icon-wrapper">
      <mat-icon>lock_outline</mat-icon>
    </div>
    <h2>Session Expired</h2>
    <p class="subtitle">Please sign in again to continue</p>
  </div>

  <div class="dialog-content">
    <form (ngSubmit)="loginProcess()" [formGroup]="formGroup">
      <div class="form-field-wrapper">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input autocomplete="off" formControlName="username" matInput placeholder="Enter your username">
          <mat-icon matSuffix>person_outline</mat-icon>
          <mat-error *ngIf="formGroup.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-field-wrapper">
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input autocomplete="off" formControlName="password" matInput placeholder="Enter your password" type="password">
          <mat-icon matSuffix>lock_outline</mat-icon>
          <mat-error *ngIf="formGroup.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>
      </div>

      <button color="primary" mat-raised-button type="submit" class="submit-btn" [disabled]="formGroup.invalid">
        Sign In
      </button>
    </form>
  </div>
</div>
