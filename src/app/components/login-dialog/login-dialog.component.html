<div class="login-dialog">
  <!-- Header Section -->
  <div class="dialog-header">
    <div class="brand-icon">
      <img src="assets/coa.png" alt="Logo" class="logo">
    </div>
    <div class="header-text">
      <h2>Session Expired</h2>
      <p class="subtitle">Your session has timed out for security reasons.<br>Please sign in again to continue.</p>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Form Section -->
  <div class="dialog-content">
    <form (ngSubmit)="loginProcess()" [formGroup]="formGroup">
      <div class="form-group">
        <label class="field-label">Username</label>
        <div class="input-wrapper" [class.focused]="usernameFocused" [class.error]="formGroup.get('username')?.invalid && formGroup.get('username')?.touched">
          <mat-icon class="input-icon">person_outline</mat-icon>
          <input
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            autocomplete="off"
            (focus)="usernameFocused = true"
            (blur)="usernameFocused = false">
        </div>
        <span class="error-message" *ngIf="formGroup.get('username')?.hasError('required') && formGroup.get('username')?.touched">
          Username is required
        </span>
      </div>

      <div class="form-group">
        <label class="field-label">Password</label>
        <div class="input-wrapper" [class.focused]="passwordFocused" [class.error]="formGroup.get('password')?.invalid && formGroup.get('password')?.touched">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="off"
            (focus)="passwordFocused = true"
            (blur)="passwordFocused = false">
          <button type="button" class="toggle-password" (click)="hidePassword = !hidePassword" tabindex="-1">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <span class="error-message" *ngIf="formGroup.get('password')?.hasError('required') && formGroup.get('password')?.touched">
          Password is required
        </span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="formGroup.invalid">
        <span class="btn-text">Sign In</span>
        <mat-icon class="btn-icon">arrow_forward</mat-icon>
      </button>
    </form>
  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <mat-icon class="security-icon">security</mat-icon>
    <span>Secure authentication</span>
  </div>
</div>
