<div class="login-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <img src="assets/coa.png" alt="Logo" class="logo">
    <h2>Session Expired</h2>
    <p class="subtitle">Please sign in again to continue</p>
  </div>

  <!-- Form -->
  <form [formGroup]="formGroup" (ngSubmit)="loginProcess()" class="login-form">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Username</mat-label>
      <mat-icon matPrefix>person_outline</mat-icon>
      <input matInput formControlName="username" placeholder="Enter your username" autocomplete="off">
      <mat-error *ngIf="formGroup.get('username')?.hasError('required')">
        Username is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Password</mat-label>
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" placeholder="Enter your password" autocomplete="off">
      <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="formGroup.get('password')?.hasError('required')">
        Password is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" class="submit-btn"
            [class.btn--loading]="formGroup.invalid">
      Sign In
    </button>
  </form>

  <!-- Footer -->
  <div class="dialog-footer">
    <mat-icon>verified_user</mat-icon>
    <span>Secure authentication</span>
  </div>
</div>
