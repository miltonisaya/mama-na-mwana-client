<div class="toast"
     [class.toast--error]="data.type === 'error'"
     [class.toast--success]="data.type === 'success'">

  <div class="toast-icon-wrap">
    <mat-icon>{{ data.type === 'error' ? 'error_outline' : 'check_circle_outline' }}</mat-icon>
  </div>

  <div class="toast-body">
    <p class="toast-title">{{ data.type === 'error' ? 'Error' : 'Success' }}</p>
    <p class="toast-message">{{ data.message }}</p>
  </div>

  <button class="toast-close" type="button" (click)="snakBarRef.dismiss()" aria-label="Dismiss notification">
    <mat-icon>close</mat-icon>
  </button>

</div>
