<div class="page-header">
  <div>
    <h2 class="page-title">
      <mat-icon>manage_accounts</mat-icon>
      My Account
    </h2>
    <p class="page-subtitle">View your profile and manage your account security</p>
  </div>
</div>

<div class="account-tabs">
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'profile'" (click)="activeTab = 'profile'">
    <mat-icon>person</mat-icon>
    Profile
  </button>
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'security'" (click)="activeTab = 'security'">
    <mat-icon>lock</mat-icon>
    Security
  </button>
</div>

@if (activeTab === 'profile') {
  <app-profile-info [user]="user"></app-profile-info>
} @else {
  <app-change-password [userId]="user?.id"></app-change-password>
}
