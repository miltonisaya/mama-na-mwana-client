<div class="page-header">
  <div>
    <h2 class="page-title">
      <mat-icon>assessment</mat-icon>
      AfyaYetu Reports
    </h2>
    <p class="page-subtitle">Access and download system reports</p>
  </div>
  <div class="btn-group">
    <button (click)="openReportParamsDialog()" *ngIf="selectedNode != null && selectedNode != undefined"
            mat-raised-button color="accent" class="action-btn">
      <mat-icon>download</mat-icon>
      Download
    </button>
    <button (click)="openDialog()" *ngIf="isSuperAdministrator" mat-raised-button color="primary" class="action-btn">
      <mat-icon>add</mat-icon>
      Add
    </button>
    <button (click)="openDialog(selectedNode)" *ngIf="selectedNode != null && selectedNode != undefined && isSuperAdministrator"
            mat-raised-button color="primary" class="action-btn">
      <mat-icon>edit</mat-icon>
      Edit
    </button>
    <button (click)="openDeleteDialog()" *ngIf="selectedNode != null && selectedNode != undefined && isSuperAdministrator"
            mat-raised-button color="warn" class="action-btn">
      <mat-icon>delete</mat-icon>
      Delete
    </button>
  </div>
</div>

<mat-card class="tree-card">
  <mat-card-content>
    <div class="tree-container report-tree">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
    <!-- This is the tree node template for leaf nodes -->
    <!-- There is inline padding applied to this node using styles.
      This padding value depends on the mat-icon-button width. -->
    <mat-tree-node (click)="onNodeClick(node)" *matTreeNodeDef="let node" [class.selected]="node === selectedNode"
                   matTreeNodeToggle>
      {{node.name}}
    </mat-tree-node>
    <!-- This is the tree node template for expandable nodes -->
    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild">
      <div class="mat-tree-node">
        <button [attr.aria-label]="'Toggle ' + node.name" mat-icon-button
                matTreeNodeToggle>
          <mat-icon class="mat-icon-rtl-mirror">
            {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        {{node.name}}
      </div>

      <div [class.report-tree-invisible]="!treeControl.isExpanded(node)" class="nested-node">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
      <!-- There is inline padding applied to this div using styles.
          This padding value depends on the mat-icon-button width.  -->
      <div [class.example-tree-invisible]="!treeControl.isExpanded(node)"
           role="group">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
      </mat-nested-tree-node>
    </mat-tree>
    </div>
  </mat-card-content>
</mat-card>

<!--delete report dialog template-->
<ng-template #deleteDialog>
  <div class="dialog-header">
    <mat-icon color="warn">warning</mat-icon>
    <h2>Confirm Deletion</h2>
  </div>
  <mat-dialog-content>
    <p>Are you sure you want to delete this report? This action cannot be undone.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button (click)="delete()" mat-raised-button color="warn">Delete</button>
  </mat-dialog-actions>
</ng-template>
