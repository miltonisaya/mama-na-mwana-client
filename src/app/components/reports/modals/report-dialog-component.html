<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">bar_chart</mat-icon>
    <div>
      <h2 mat-dialog-title>{{ReportService.form.controls['id'].value ? "Edit Report" : "Create Report"}}</h2>
      <p class="mnm-dialog-subtitle">Configure report name, URL, and parent category</p>
    </div>
  </div>

  <form #formDirective="ngForm" [formGroup]="ReportService.form" (ngSubmit)="submitForm(ReportService.form)">
    <mat-dialog-content class="mnm-dialog-body">

      <!-- Name -->
      <div class="rd-group">
        <label class="rd-label">Name</label>
        <div class="rd-wrap">
          <mat-icon class="rd-icon">label</mat-icon>
          <input class="rd-input" formControlName="name" type="text" autocomplete="off"
            placeholder="Report name" required>
        </div>
      </div>

      <!-- URL -->
      <div class="rd-group">
        <label class="rd-label">URL</label>
        <div class="rd-wrap">
          <mat-icon class="rd-icon">link</mat-icon>
          <input class="rd-input" formControlName="url" type="text" autocomplete="off"
            placeholder="Report URL" required>
        </div>
      </div>

      <!-- Parent Report -->
      <div class="rd-group">
        <label class="rd-label">Parent Report</label>
        <div class="rd-wrap">
          <mat-icon class="rd-icon">account_tree</mat-icon>
          <select class="rd-input rd-select" formControlName="parentId">
            <option value="">— None —</option>
            @for (report of reports; track report) {
              <option [value]="report.id">{{report.name}}</option>
            }
          </select>
        </div>
      </div>

    </mat-dialog-content>

    <mat-dialog-actions class="mnm-dialog-foot">
      <button mat-button mat-dialog-close type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit">
        {{ReportService.form.controls['id'].value ? "Update" : "Create"}}
      </button>
    </mat-dialog-actions>
  </form>
</div>
