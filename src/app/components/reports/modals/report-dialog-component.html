<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">bar_chart</mat-icon>
    <div>
      <h2 mat-dialog-title>{{ReportService.form.controls['id'].value ? "Edit Report" : "Create Report"}}</h2>
      <p class="mnm-dialog-subtitle">Configure report name, URL, and parent category</p>
    </div>
  </div>

  <form #formDirective="ngForm" [formGroup]="ReportService.form" (ngSubmit)="submitForm(ReportService.form)">
    <mat-dialog-content class="mnm-dialog-body">
      <mat-form-field appearance="outline" class="mnm-field">
        <mat-label>Name</mat-label>
        <mat-icon matPrefix>label</mat-icon>
        <input matInput autocomplete="off" formControlName="name" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="mnm-field">
        <mat-label>URL</mat-label>
        <mat-icon matPrefix>link</mat-icon>
        <input matInput autocomplete="off" formControlName="url" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="mnm-field">
        <mat-label>Parent Report</mat-label>
        <mat-icon matPrefix>account_tree</mat-icon>
        <select matNativeControl formControlName="parentId">
          <option value="">— None —</option>
          <option *ngFor="let report of reports" [value]="report.id">{{report.name}}</option>
        </select>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="mnm-dialog-foot">
      <button mat-button mat-dialog-close type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit">
        {{ReportService.form.controls['id'].value ? "Update" : "Create"}}
      </button>
    </mat-dialog-actions>
  </form>
</div>
