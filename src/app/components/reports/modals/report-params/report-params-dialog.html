<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">tune</mat-icon>
    <div>
      <h2 mat-dialog-title>Report Parameters</h2>
      <p class="mnm-dialog-subtitle">{{selectedNode.name}}</p>
    </div>
  </div>

  <mat-dialog-content class="mnm-dialog-body">
    <ng-container *ngFor="let param of params">
      <ng-container [ngSwitch]="param.name">
        <ng-container *ngSwitchCase="'start_date' || 'end_date'">
          <div class="mnm-row">
            <mat-form-field appearance="outline" class="mnm-field">
              <mat-label>Start Date</mat-label>
              <mat-icon matPrefix>event</mat-icon>
              <input matInput [formControl]="startDate" [matDatepicker]="startDatePicker">
              <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #startDatePicker></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="mnm-field">
              <mat-label>End Date</mat-label>
              <mat-icon matPrefix>event</mat-icon>
              <input matInput [formControl]="endDate" [matDatepicker]="endDatePicker">
              <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #endDatePicker></mat-datepicker>
            </mat-form-field>
          </div>
        </ng-container>

        <mat-form-field *ngSwitchCase="'organisationUnitId'" appearance="outline" class="mnm-field">
          <mat-label>Search for council</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput type="text" [formControl]="myControl" [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
            <mat-option *ngFor="let option of filteredOptions | async" [value]="option">{{option.name}}</mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </ng-container>
    </ng-container>
  </mat-dialog-content>

  <mat-dialog-actions class="mnm-dialog-foot">
    <button mat-button mat-dialog-close type="button">Cancel</button>
    <button mat-raised-button color="primary" type="button" (click)="generateReport()">
      Generate Report
    </button>
  </mat-dialog-actions>
</div>
