<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">category</mat-icon>
    <div>
      <h2 mat-dialog-title>Map Data Element to Category</h2>
      <p class="mnm-dialog-subtitle">Category: <strong>{{ data.categoryName }}</strong></p>
    </div>
  </div>

  <form #formDirective="ngForm" [formGroup]="flowKeyService.form" (ngSubmit)="submitForm(flowKeyService.form)">
    <mat-dialog-content class="mnm-dialog-body">
      <mat-form-field appearance="outline" class="mnm-field">
        <mat-label>Search for DHIS2 data element</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text" [formControl]="dataElement" [matAutocomplete]="yes">
        <mat-autocomplete #yes="matAutocomplete" [displayWith]="displayFn">
          @for (option of filteredOptions | async; track option) {
            <mat-option [value]="option">
              {{ "(" + option.code + ") - " + option.name }}
            </mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="mnm-dialog-foot">
      <button mat-button mat-dialog-close type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit" (click)="mapCategoryAndDataElement()">
        Map
      </button>
    </mat-dialog-actions>
  </form>
</div>
