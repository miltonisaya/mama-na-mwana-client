<div class="mnm-dialog">
  <div class="mnm-dialog-head">
    <mat-icon class="mnm-dialog-icon">link</mat-icon>
    <div>
      <h2 mat-dialog-title>Map Data Element to Key</h2>
      <p class="mnm-dialog-subtitle">Key: <strong>{{ data.keyName }}</strong></p>
    </div>
  </div>

  <form #formDirective="ngForm" [formGroup]="flowKeyService.form" (ngSubmit)="submitForm(flowKeyService.form)">
    <mat-dialog-content class="mnm-dialog-body">
      <mat-form-field appearance="outline" class="mnm-field">
        <mat-label>Search for DHIS2 data element</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="text" [formControl]="myControl" [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let option of filteredOptions | async" [value]="option">{{option.name}}</mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="mnm-dialog-foot">
      <button mat-button mat-dialog-close type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit" (click)="mapDataElement()">
        Map
      </button>
    </mat-dialog-actions>
  </form>
</div>
