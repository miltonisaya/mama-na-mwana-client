<div>
  <mat-progress-bar
    *ngIf="loaderService.isLoading | async"
    class="loader-container"
    mode="indeterminate"
  >
  </mat-progress-bar>
</div>
<mat-toolbar color="primary" class="mat-elevation-z1">
  <mat-toolbar-row>
    <button (click)="toggleSidebar()" mat-icon-button>
      <mat-icon>menu</mat-icon>
    </button>

    <span>AfyaYetu Integration Services</span>

    <div class="toolbar-spacer"></div>
    <div class="toolbar-icons">
      <ul>
        <li>
          <button mat-icon-button>
            <mat-icon>settings</mat-icon>
          </button>
        </li>
        <li>
          <button mat-icon-button>
            <mat-icon>help_outline</mat-icon>
          </button>
        </li>
        <li>
          <button [matMenuTriggerFor]="menu" mat-button>
            <mat-icon>person_outline</mat-icon>
          </button>
          <mat-menu #menu="">
            <button (click)="profile()" mat-menu-item>
              <mat-icon>supervised_user_circle</mat-icon>
              Profile
            </button>
            <button (click)="signOut()" mat-menu-item>
              <mat-icon>exit_to_app</mat-icon>
              Sign Out
            </button>
          </mat-menu>
        </li>
      </ul>
    </div>
  </mat-toolbar-row>
</mat-toolbar>
