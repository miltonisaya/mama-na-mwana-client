<div class="profile-card">
  <div class="header">
    <h3>Logged in as: {{user.name | titlecase}}</h3>
  </div>
</div>
<mat-divider></mat-divider>

<mat-nav-list>
  <ng-container *ngFor="let item of menus">
    <mat-accordion *ngIf="item.children && item.children.length > 0" class="sidebar-group">
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            <span class="sidebar-item sidebar-item--parent">
              <mat-icon class="sidebar-item__icon">{{item.icon}}</mat-icon>
              <span class="sidebar-item__label">{{item.name}}</span>
            </span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <ng-container *ngFor="let child of item.children">
          <mat-list-item
            class="sidebar-child-link"
            [routerLink]="'/' + child.url"
            routerLinkActive="sidebar-link--active">
            <span class="sidebar-item sidebar-item--child">
              <mat-icon class="sidebar-item__icon">{{child.icon}}</mat-icon>
              <span class="sidebar-item__label">{{child.name}}</span>
            </span>
          </mat-list-item>
        </ng-container>
      </mat-expansion-panel>
    </mat-accordion>

    <mat-list-item
      *ngIf="!item.children || item.children.length === 0"
      class="sidebar-parent-link"
      [routerLink]="'/' + item.url"
      routerLinkActive="sidebar-link--active">
      <span class="sidebar-item sidebar-item--parent">
        <mat-icon class="sidebar-item__icon">{{item.icon}}</mat-icon>
        <span class="sidebar-item__label">{{item.name}}</span>
      </span>
    </mat-list-item>
  </ng-container>
</mat-nav-list>
